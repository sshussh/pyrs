[package]
name = "pyrs"
version = "0.141.0"
edition = "2024"

[dependencies]
common = { path="../common" }
lexer = { path="../lexer" }
parser = { path="../parser" }
semantic = { path="../semantic" }
ir = { path="../ir" }
codegen = { path="../codegen" }

# `error-context` and `suggestions` are what turn "unexpected argument found"
# into a message naming the argument and offering the flag that was meant.
clap = { version = "4.6.0", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
clap_complete = { version = "4.5", default-features = false }
toml = { version = "1.1.5", default-features = false, features = ["parse"] }
